<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>跳转中…</title>
<script>
(function(){
  var lang = '';
  try { lang = localStorage.getItem('xueai_lang') || ''; } catch(e) {}
  if (!lang) {
    var nav = (navigator.language || '').toLowerCase();
    if (nav.indexOf('ko') === 0) lang = 'ko';
    else if (/^zh-(hk|mo)/.test(nav)) lang = 'hk';
    else if (/^zh-(tw|hant)/.test(nav)) lang = 'tw';
    else if (nav.indexOf('zh') === 0) lang = 'zh';
    else lang = 'en';
  }
  window.location.replace(lang === 'zh' ? 'learn.html' : 'learn.' + lang + '.html');
})();
</script>
<meta http-equiv="refresh" content="0;url=learn.html">
</head>
<body>
<p>正在跳转到课程页，如未自动跳转，<a href="learn.html">请点击这里</a>。</p>
</body>
</html>
